# Example workflow: bump project version on every push to main.
# Copy to .github/workflows/version-bump.yml in your application.

name: Bump project version

on:
  push:
    branches: [main, master]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run version bump
        run: php artisan version:bump --from=${{ github.event.before }} --to=${{ github.sha }}

      - name: Commit version change
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: bump project version [skip ci]"
            git push
          fi
